name: Daily Selection Crawler

on:
  schedule:
    # JST 05:00 = UTC 20:00
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Run selection crawler one by one
        run: |
          for i in $(seq 0 91); do
            echo "crawler offset=$i"
            curl -s "https://www.sakamatch.com/api/cron/selection-crawler?offset=${i}&limit=1"
            echo ""
            sleep 2
          done